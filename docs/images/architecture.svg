<svg viewBox="0 0 680 348" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>错题集系统架构</title>
<desc>浏览器端负责渲染、切题与导出，云端负责登录认证、关系型数据与私有文件存储。</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="46" width="288" height="272" rx="18" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="60" y="72" font-family="ui-sans-serif,system-ui,-apple-system" font-size="14" font-weight="500" fill="#0C447C">浏览器（无构建后端）</text>
<text x="60" y="90" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#185FA5">React 18 · Vite · TypeScript</text>

<rect x="60" y="104" width="248" height="58" rx="9" fill="#fff" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="74" y="126" font-family="ui-sans-serif,system-ui,-apple-system" font-size="13" font-weight="500" fill="#0C447C">切题管线</text>
<text x="74" y="145" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#185FA5">OCR 题号 → 文字层 → 图像投影</text>

<rect x="60" y="172" width="248" height="58" rx="9" fill="#fff" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="74" y="194" font-family="ui-sans-serif,system-ui,-apple-system" font-size="13" font-weight="500" fill="#0C447C">页面</text>
<text x="74" y="213" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#185FA5">今日 · 秒标记 · 试卷库 · 复习 · 导出</text>

<rect x="60" y="240" width="248" height="58" rx="9" fill="#fff" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="74" y="262" font-family="ui-sans-serif,system-ui,-apple-system" font-size="13" font-weight="500" fill="#0C447C">渲染与导出</text>
<text x="74" y="281" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#185FA5">pdf.js · Canvas 裁切 · jsPDF</text>

<rect x="368" y="46" width="272" height="272" rx="18" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="388" y="72" font-family="ui-sans-serif,system-ui,-apple-system" font-size="14" font-weight="500" fill="#085041">云端（托管）</text>
<text x="388" y="90" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#0F6E56">认证 · 数据库 · 对象存储</text>

<rect x="388" y="104" width="232" height="58" rx="9" fill="#fff" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="402" y="126" font-family="ui-sans-serif,system-ui,-apple-system" font-size="13" font-weight="500" fill="#085041">Auth</text>
<text x="402" y="145" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#0F6E56">手机验证码 · 密码登录</text>

<rect x="388" y="172" width="232" height="58" rx="9" fill="#fff" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="402" y="194" font-family="ui-sans-serif,system-ui,-apple-system" font-size="13" font-weight="500" fill="#085041">Postgres</text>
<text x="402" y="213" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#0F6E56">4 张表 · 每表一条 RLS 策略</text>

<rect x="388" y="240" width="232" height="58" rx="9" fill="#fff" stroke="#9FE1CB" stroke-width="0.5"/>
<text x="402" y="262" font-family="ui-sans-serif,system-ui,-apple-system" font-size="13" font-weight="500" fill="#085041">私有存储</text>
<text x="402" y="281" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11.5" fill="#0F6E56">users/&lt;uid&gt;/… · 1h 签名 URL</text>

<line x1="330" y1="133" x2="366" y2="133" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="366" y1="269" x2="330" y2="269" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="348" y="122" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11" fill="#5F5E5A">JSON</text>
<text x="348" y="292" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system" font-size="11" fill="#5F5E5A">图片</text>
</svg>
